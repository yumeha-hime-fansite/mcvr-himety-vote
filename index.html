ko:{documentTitle:'夢羽ヒメ｜M-COM VR 투표 응원',mainTitle:'夢羽ヒメ 응원 투표',listen:'YouTube에서 곡 듣기',listenAria:'YouTube에서 彩光 -イリザシオン- 듣기 (새 탭에서 열림)',theme:'#VTuber악곡랭킹',deadline:'🏁 10/27(화) 23:59까지 (JST)',today:'오늘의 투표',remaining:n=>`${n}표 남음`,recorded2:'2표 기록',msg0:'오늘의 2표를 잊지 마세요.',msg1:'1표 남았습니다. 다른 방법의 투표도 잊지 마세요!',msg2:'오늘의 2표를 기록했습니다. 필요하면 투표 페이지를 다시 열 수 있어요.',post:'𝕏 포스트로 투표',dm:'✉️ DM으로 투표',postDone:'𝕏 포스트로 투표 ✓',dmDone:'✉️ DM으로 투표 ✓',editor:'투표 문구 조정 (선택)',commentLabel:'추천 포인트・응원 코멘트',placeholder:'예: 힘 있으면서도 맑은 목소리와 빛이 스며드는 듯한 세계관이 정말 좋아요!',warning:'투표 집계에 영향을 주지 않도록 코멘트 안에서는 ( ) （ ） 및 『 』를 사용하지 마세요.',dateOption:'날짜 넣기',videoOption:'MV URL 넣기 (X 포스트만)',pageOption:'이 투표 페이지 URL 넣기 (X 포스트만)',preview:'투표 문구 미리보기',copy:'📋 투표 문구 복사',history:'👑 응원의 발자국',historySub:'투표 기록을<br>이 기기에 저장',legendPost:'포스트',legendDm:'DM',todayTag:'오늘',undo:'오늘 기록 수정하기',dataNote:'※ 버튼을 누르면 그날의 P／DM이 기록됩니다. 같은 버튼은 필요하면 다시 누를 수 있습니다. 기록은 이 브라우저에 저장되며 Cookie·사이트 데이터 삭제 또는 기기 변경 시 이어지지 않습니다.',footer:`이 사이트는 팬이 만든 비공식 사이트이며 夢羽ヒメ 및 M-COM VR과 관련이 없습니다.<br>투표 조건과 마감은 반드시 <a href="${CONFIG.officialPostUrl}" target="_blank" rel="noopener noreferrer">공식 안내</a>를 확인해 주세요.<br>문의: <a href="https://x.com/amgs_lvhmt" target="_blank" rel="noopener noreferrer">@amgs_lvhmt</a>`,remainingDays:n=>`${n}일 남음`,deadlineToday:'오늘 마감',checkOfficial:'공식 안내 확인',ended:'투표 종료',before:'투표 기간이 아직 시작되지 않았습니다.',expired:'투표 기간이 종료되었습니다. 저장된 응원 기록은 계속 확인할 수 있습니다.',undoPost:'오늘의 포스트 투표 기록을 삭제할까요?',undoDm:'오늘의 DM 투표 기록을 삭제할까요?',undoToast:type=>`${type==='post'?'포스트':'DM'} 기록을 삭제했습니다`,copied:'투표 문구를 복사했습니다',copiedShort:'복사했습니다',presetLabel:i=>`추천 ${i+1}`,presets:['힘 있으면서도 맑은 목소리와 빛이 스며드는 듯한 세계관이 정말 좋아요!','웅장한 사운드와 시원하게 뻗는 보컬이 어우러져 들을 때마다 가슴이 뜨거워져요!','앞으로 나아갈 힘을 주는 소중한 곡이에요. 더 많은 분들에게 닿았으면 좋겠습니다!']}}

const $=id=>document.getElementById(id),LANG_LOCALE={ja:'ja-JP',en:'en-US',zh:'zh-CN',ko:'ko-KR'},HTML_LANG={ja:'ja',en:'en',zh:'zh-CN',ko:'ko'};
function getCookie(name){return document.cookie.split(';').map(v=>v.trim()).find(v=>v.startsWith(name+'='))?.split('=').slice(1).join('=')||''}function setCookie(name,value,days=365){document.cookie=`${name}=${encodeURIComponent(value)}; Max-Age=${days*86400}; Path=/; SameSite=Lax`}function detectLanguage(){const saved=decodeURIComponent(getCookie(CONFIG.languageCookie)||'');if(I18N[saved])return saved;const lang=(navigator.language||'ja').toLowerCase();if(lang.startsWith('zh'))return'zh';if(lang.startsWith('ko'))return'ko';if(lang.startsWith('en'))return'en';return'ja'}let currentLang=detectLanguage();function L(){return I18N[currentLang]||I18N.ja}function renderPresetRow(){$('presetRow').innerHTML=L().presets.map((p,i)=>`<button type="button" class="chip" onclick="setPreset(${i})">${L().presetLabel(i)}</button>`).join('')}function applyLanguage(){const t=L();document.documentElement.lang=HTML_LANG[currentLang];document.title=t.documentTitle;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===currentLang));$('mainTitle').textContent=t.mainTitle;$('listenText').textContent=t.listen;$('songLink').setAttribute('aria-label',t.listenAria);$('themePill').textContent=t.theme;$('deadlinePill').textContent=t.deadline;$('todayLabel').textContent=t.today;$('editorSummary').textContent=t.editor;$('commentLabel').textContent=t.commentLabel;$('comment').placeholder=t.placeholder;$('warning').textContent=t.warning;$('includeDateLabel').textContent=t.dateOption;$('includeVideoLabel').textContent=t.videoOption;$('includePageLabel').textContent=t.pageOption;$('previewLabel').textContent=t.preview;$('copyBtn').textContent=t.copy;$('historyTitle').textContent=t.history;$('historySub').innerHTML=t.historySub;$('legendPost').textContent=t.legendPost;$('legendDm').textContent=t.legendDm;$('undoButton').textContent=t.undo;$('dataNote').textContent=t.dataNote;$('footerText').innerHTML=t.footer;renderPresetRow()}function setLanguage(lang){if(!I18N[lang])return;currentLang=lang;setCookie(CONFIG.languageCookie,lang);applyLanguage();refreshPreview();refreshUI()}$('songLink').href=CONFIG.videoUrl;
function tokyoParts(date=new Date()){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date).reduce((o,p)=>(o[p.type]=p.value,o),{});return{y:+parts.year,m:+parts.month,d:+parts.day,key:`${parts.year}-${parts.month}-${parts.day}`}}function parseDateKey(key){const[y,m,d]=key.split('-').map(Number);return{y,m,d}}function dateKeyToUtc(key){const{y,m,d}=parseDateKey(key);return Date.UTC(y,m-1,d)}function compareDateKeys(a,b){return Math.sign(dateKeyToUtc(a)-dateKeyToUtc(b))}function formatMD(key){const{m,d}=parseDateKey(key);return`${m}/${d}`}function dateForKey(key){const{y,m,d}=parseDateKey(key);return new Date(Date.UTC(y,m-1,d))}function formatTodayLabel(key){return new Intl.DateTimeFormat(LANG_LOCALE[currentLang],{month:'short',day:'numeric',weekday:'short',timeZone:'UTC'}).format(dateForKey(key))}function formatWeekday(key){return new Intl.DateTimeFormat(LANG_LOCALE[currentLang],{weekday:'short',timeZone:'UTC'}).format(dateForKey(key))}function campaignDates(){const dates=[],today=tokyoParts().key,endKey=CONFIG.endDate||today;let t=dateKeyToUtc(CONFIG.startDate),end=dateKeyToUtc(endKey);if(end<t)return dates;while(t<=end){const d=new Date(t);dates.push(`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`);t+=86400000}return dates}function loadLog(){try{return JSON.parse(localStorage.getItem(CONFIG.storageKey))||{}}catch{return{}}}function saveLog(log){localStorage.setItem(CONFIG.storageKey,JSON.stringify(log))}
function getOptions(){const defaults={includeDate:true,includeVideo:false,includePageLink:false,comment:'',editorOpen:false};try{return{...defaults,...JSON.parse(localStorage.getItem(CONFIG.optionKey)||'{}')}}catch{return defaults}}function saveOptions(){localStorage.setItem(CONFIG.optionKey,JSON.stringify({includeDate:$('includeDate').checked,includeVideo:$('includeVideo').checked,includePageLink:$('includePageLink').checked,comment:$('comment').value,editorOpen:$('editorDetails').open}))}function todayState(){const key=tokyoParts().key,log=loadLog(),row=log[key]||{};return{key,post:!!row.post,dm:!!row.dm,count:(row.post?1:0)+(row.dm?1:0)}}function isCampaignActive(){const now=new Date(),started=compareDateKeys(tokyoParts(now).key,CONFIG.startDate)>=0;if(!started)return false;return CONFIG.deadlineIso?now<=new Date(CONFIG.deadlineIso):true}function containsForbidden(text){return/[()（）『』]/.test(text)}function xWeightedLength(text){const urlRegex=/https?:\/\/[^\s]+/g,urls=text.match(urlRegex)||[];let stripped=text.replace(urlRegex,''),points=0;for(const ch of stripped)points+=/^[\x00-\x7F\uFF61-\uFF9F]$/.test(ch)?1:2;return points+urls.length*23}
function currentPageUrl(){return location.protocol==='file:'?'':location.href.split('#')[0].split('?')[0]}function generateVoteText(type='post'){const opt=getOptions();let text='';if(opt.includeDate)text+=`${tokyoParts().key.replaceAll('-','/')}\n`;text+=`(${CONFIG.artistName})さんの『${CONFIG.songTitle}』に投票します！`;const comment=(opt.comment||'').trim();if(comment)text+=`\n\n${comment}`;text+=`\n\n${CONFIG.hashtags}`;if(type==='post'&&opt.includeVideo)text+=`\n\n${CONFIG.videoUrl}`;const pageUrl=currentPageUrl();if(type==='post'&&opt.includePageLink&&pageUrl)text+=`\n\n🗳投票サイト⏬\n${pageUrl}`;return text}function refreshPreview(){const text=generateVoteText('post');$('preview').textContent=text;const n=xWeightedLength(text),display=(n/2).toFixed(1).replace('.0','');$('charCount').textContent=`${display} / 140`;const invalid=containsForbidden($('comment').value);$('warning').style.display=invalid?'block':'none';$('charCount').style.color=(invalid||n>280)?'#70449d':'var(--pink-dark)';$('copyBtn').disabled=invalid||n>280}function onCommentInput(){saveOptions();refreshPreview();refreshUI()}function saveOptionAndRefresh(){saveOptions();refreshPreview();refreshUI()}function setPreset(i){$('comment').value=L().presets[i];saveOptions();refreshPreview();refreshUI()}function setupEditor(){const opt=getOptions();$('includeDate').checked=opt.includeDate;$('includeVideo').checked=opt.includeVideo;$('includePageLink').checked=opt.includePageLink;$('comment').value=opt.comment||'';$('editorDetails').open=!!opt.editorOpen;renderPresetRow();refreshPreview()}function voteTextValid(type='post'){const t=generateVoteText(type);return!containsForbidden($('comment').value)&&xWeightedLength(t)<=280}
function startVote(type){if(!isCampaignActive()||!voteTextValid(type))return;const key=tokyoParts().key,log=loadLog();if(!log[key])log[key]={};log[key][type]=true;saveLog(log);refreshUI();const text=encodeURIComponent(generateVoteText(type)),url=type==='post'?`https://x.com/intent/tweet?text=${text}`:`https://x.com/messages/compose?recipient_id=${CONFIG.recipientId}&text=${text}`;window.open(url,'_blank')}function undoToday(){const key=tokyoParts().key,log=loadLog(),row=log[key]||{};if(!row.post&&!row.dm)return;let target=null;if(row.dm&&confirm(L().undoDm))target='dm';else if(row.post&&confirm(L().undoPost))target='post';else return;delete row[target];log[key]=row;saveLog(log);refreshUI();toast(L().undoToast(target))}
function renderHistory(){const log=loadLog(),today=tokyoParts().key,t=L();$('historyGrid').innerHTML=campaignDates().map(key=>{const row=log[key]||{},post=!!row.post,dm=!!row.dm,cmp=compareDateKeys(key,today),cls=['day-card'];if(key===today)cls.push('today');if(cmp>0)cls.push('future');return`<div class="${cls.join(' ')}">${key===today?`<span class="today-tag">${t.todayTag}</span>`:''}<div class="day-date">${formatMD(key)}</div><div class="day-votes"><span class="dot ${post?'on':''}">P</span><span class="dot ${dm?'on':''}">D</span></div></div>`}).join('')}
function refreshUI(){const state=todayState(),active=isCampaignActive(),postInvalid=!voteTextValid('post'),dmInvalid=!voteTextValid('dm'),t=L();$('todayDate').textContent=formatTodayLabel(state.key);$('todayCount').textContent=`${state.count} / 2`;$('todayProgress').style.width=`${state.count*50}%`;$('remainingText').textContent=state.count===2?t.recorded2:t.remaining(2-state.count);$('todayMessage').textContent=state.count===2?t.msg2:state.count===1?t.msg1:t.msg0;[['postBtn','post'],['dmBtn','dm']].forEach(([id,type])=>{const b=$(id),recorded=state[type];b.textContent=type==='post'?(recorded?t.postDone:t.post):(recorded?t.dmDone:t.dm);b.disabled=!active||(type==='post'?postInvalid:dmInvalid)});$('undoArea').classList.toggle('show',state.count>0);const todayKey=tokyoParts().key;if(CONFIG.endDate){const endMs=dateKeyToUtc(CONFIG.endDate),todayMs=dateKeyToUtc(todayKey),remain=Math.floor((endMs-todayMs)/86400000)+1;$('daysRemaining').textContent=remain>1?t.remainingDays(remain):remain===1?t.deadlineToday:t.ended}else{$('daysRemaining').textContent=t.checkOfficial}renderHistory();const banner=$('expiredBanner');if(!active){banner.classList.add('show');banner.textContent=compareDateKeys(todayKey,CONFIG.startDate)<0?t.before:t.expired}else banner.classList.remove('show')}
async function copyVoteText(){try{await navigator.clipboard.writeText(generateVoteText('post'));toast(L().copied)}catch{fallbackCopy(generateVoteText('post'))}}function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(L().copiedShort)}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
$('editorDetails').addEventListener('toggle',()=>saveOptions());applyLanguage();setupEditor();refreshUI();setInterval(()=>refreshUI(),1000);
</script>
